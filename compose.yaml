services:
  web:
    image: httpd:2.4
    container_name: lab-web
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/local/apache2/htdocs:ro
      - ./config/servername.conf:/usr/local/apache2/conf/extra/servername.conf:ro
    command: ["httpd-foreground", "-c", "Include conf/extra/servername.conf"]
    restart: unless-stopped
